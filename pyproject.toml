[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-size-calculator"
version = "0.1.0"
description = "Compute Cohen's d, Hedges' g, Glass's delta, odds/risk ratios with confidence intervals."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
effect-size-calculator = "effect_size_calculator.cli:main"

[tool.setuptools]
packages = ["effect_size_calculator"]
